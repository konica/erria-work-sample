<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Erria Outreach Agent — Sign in</title>
<link rel="icon" href="assets/erria-favicon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Erria Outreach Agent — auth gate (Landing + 3 state variants)
   Same tokens / type / light-dark system as the console.
   Keycloak (OIDC) owns the credential UI; this file only renders
   the app-owned states before/around that handoff.
   ============================================================ */
:root {
  --bg: #ffffff;
  --surface: #f5f4f7;
  --panel: #ffffff;
  --border: #ebf0f7;
  --border-strong: #dbe3ef;
  --fg: #0f172a;
  --muted: #5a5a5a;
  --faint: #8a93a3;

  --brand: #1e73be;
  --brand-strong: #1a66a8;
  --brand-tint: #eaf2fa;
  --on-brand: #ffffff;

  --ok-fg: #15803d; --ok-bg: #e9f6ee; --ok-bd: #bfe3cc;
  --warn-fg: #b45309; --warn-bg: #fdf3e0; --warn-bd: #f0d4a2;

  --chip: #0f172a;          /* logo chip — always dark navy (white-mark caveat) */
  --glow: color-mix(in oklch, var(--brand) 9%, transparent);

  --radius: 8px;
  --radius-sm: 6px;
  --shadow-card: 0 1px 2px rgba(15,23,42,.05), 0 10px 30px rgba(15,23,42,.08);
  --shadow-btn: 0 1px 0 rgba(15,23,42,.06), 0 6px 16px rgba(30,115,190,.30);

  --font: "Inter", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1a2438;
  --panel: #151f33;
  --border: #2a3650;
  --border-strong: #37456180;
  --fg: #f5f4f7;
  --muted: #9aa3b2;
  --faint: #6b7688;

  --brand: #4a9bd8;
  --brand-strong: #5aa8e0;
  --brand-tint: #16304a;
  --on-brand: #08111f;

  --ok-fg: #4ade80; --ok-bg: #15301f; --ok-bd: #275033;
  --warn-fg: #fbbf24; --warn-bg: #362a12; --warn-bd: #5c4a1e;

  --glow: color-mix(in oklch, var(--brand) 20%, transparent);
  --shadow-card: 0 1px 2px rgba(0,0,0,.4), 0 18px 46px rgba(0,0,0,.5);
  --shadow-btn: 0 1px 0 rgba(0,0,0,.3), 0 6px 18px rgba(74,155,216,.35);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
svg { width: 16px; height: 16px; vertical-align: -0.15em; flex: 0 0 auto; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
a { color: var(--brand-strong); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------- shared shell ---------- */
.gate { min-height: 100vh; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.gate::before {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(1100px 560px at 50% -8%, var(--glow), transparent 68%),
    linear-gradient(to bottom, transparent 62%, color-mix(in oklch, var(--surface) 60%, transparent));
}
.topbar {
  position: relative; z-index: 2;
  display: flex; align-items: center; gap: 12px;
  padding: 18px 22px;
}
.topbar .spacer { flex: 1; }

.lang-toggle {
  display: inline-flex; align-items: center; gap: 2px;
  border: 1px solid var(--border-strong); background: var(--panel);
  border-radius: 999px; padding: 3px; box-shadow: var(--shadow-card);
}
.lang-toggle button {
  border: 0; background: transparent; color: var(--muted);
  font-size: 12.5px; font-weight: 600; letter-spacing: .01em;
  padding: 5px 13px; border-radius: 999px; line-height: 1.2;
}
.lang-toggle button:hover { color: var(--fg); }
.lang-toggle button.active { background: var(--brand); color: var(--on-brand); }

.theme-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 34px;
  border: 1px solid var(--border-strong); background: var(--panel); color: var(--muted);
  border-radius: 999px; box-shadow: var(--shadow-card);
}
.theme-toggle:hover { color: var(--fg); }

.center { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 20px 40px; }

.card {
  width: 100%; max-width: 428px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow-card);
  padding: 40px 40px 34px;
  text-align: center;
}
.brand { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 26px; }
.chip {
  width: 62px; height: 62px; flex: 0 0 auto;
  background: var(--chip); border-radius: 14px;
  display: flex; align-items: center; justify-content: center; padding: 12px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), 0 6px 18px rgba(15,23,42,.18);
}
.chip img { width: 100%; height: 100%; object-fit: contain; }
.wordmark { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.wordmark .sub { display: block; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); margin-top: 6px; }

/* per-state center content */
.state { animation: rise .22s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.tagline { font-size: 14.5px; line-height: 1.55; color: var(--muted); margin: 0 auto 26px; max-width: 34ch; }

.kicker {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  padding: 4px 11px; border-radius: 999px; border: 1px solid transparent; margin-bottom: 14px;
}
.kicker svg { width: 13px; height: 13px; }
.kicker.ok { color: var(--ok-fg); background: var(--ok-bg); border-color: var(--ok-bd); }
.kicker.warn { color: var(--warn-fg); background: var(--warn-bg); border-color: var(--warn-bd); }

.status { font-size: 17px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 6px; }
.sub { font-size: 13.5px; color: var(--muted); margin: 0 auto 24px; max-width: 32ch; }

.btn-login {
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  width: 100%;
  background: var(--brand); color: var(--on-brand);
  border: 1px solid var(--brand);
  border-radius: 10px; padding: 13px 20px;
  font-size: 15px; font-weight: 600; letter-spacing: .01em;
  box-shadow: var(--shadow-btn);
  transition: background .14s, transform .05s, box-shadow .14s;
}
.btn-login:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
.btn-login:active { transform: translateY(1px); }
.btn-login svg { width: 17px; height: 17px; transition: transform .16s; }
.btn-login:hover svg { transform: translateX(3px); }

.secure { display: inline-flex; align-items: center; gap: 6px; justify-content: center; font-size: 12px; color: var(--faint); margin: 14px 0 0; }
.secure svg { width: 13px; height: 13px; }

/* redirecting spinner */
.spin { width: 34px; height: 34px; margin: 8px auto 20px; border-radius: 50%; border: 3px solid var(--border-strong); border-top-color: var(--brand); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* footer */
.foot {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 24px; flex-wrap: wrap;
  border-top: 1px solid var(--border);
  font-size: 12px; color: var(--faint);
}
.foot .ver { font-family: var(--mono); font-size: 11.5px; }
.foot .ver .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--warn-fg); margin-right: 7px; vertical-align: 1px; }
.foot .support { color: var(--muted); }

/* mockup-only state previewer — clearly marked, not product chrome */
.preview {
  position: fixed; z-index: 5; left: 50%; bottom: 14px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px;
  background: color-mix(in oklch, var(--panel) 90%, transparent);
  backdrop-filter: blur(8px);
  border: 1px dashed var(--border-strong); border-radius: 999px;
  padding: 6px 8px 6px 14px; box-shadow: var(--shadow-card);
  font-size: 12px;
}
.preview .pl { color: var(--faint); font-weight: 600; letter-spacing: .02em; margin-right: 2px; }
.preview .pl b { color: var(--muted); font-weight: 700; }
.preview button { border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 999px; }
.preview button:hover { color: var(--fg); border-color: var(--border-strong); }
.preview button.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }

@media (max-width: 560px) {
  .card { padding: 32px 24px 28px; }
  .foot { justify-content: center; text-align: center; }
  .preview { flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); }
}
</style>
</head>
<body>
<div class="gate" data-od-id="auth-gate">
  <div class="topbar" data-od-id="gate-topbar">
    <div class="spacer"></div>
    <div class="lang-toggle" role="group" aria-label="Language" data-od-id="lang-toggle">
      <button data-lang="en" data-od-id="lang-en">EN</button>
      <button data-lang="da" data-od-id="lang-da">Dansk</button>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Theme" data-od-id="theme-toggle"></button>
  </div>

  <main class="center">
    <section class="card" id="card" data-od-id="gate-card"><!-- rendered by JS --></section>
  </main>

  <footer class="foot" data-od-id="gate-footer">
    <span class="ver"><span class="dot"></span>v0.4 · staging</span>
    <span class="support" id="support"></span>
  </footer>

  <div class="preview" data-od-id="state-previewer">
    <span class="pl">Preview states <b>· mockup only</b></span>
    <button data-state="landing" data-od-id="prev-landing">Landing</button>
    <button data-state="redirecting" data-od-id="prev-redirecting">Redirecting</button>
    <button data-state="loggedOut" data-od-id="prev-loggedout">Signed out</button>
    <button data-state="expired" data-od-id="prev-expired">Expired</button>
  </div>
</div>

<script>
const CONSOLE_URL = 'outreach-console.html';   // where a successful sign-in lands (mock of the Keycloak round-trip)

const I18N = {
  en: {
    productSub: 'Outreach Console',
    tagline: 'Internal console for reviewing and sending AI-drafted customer outreach, and handling escalations.',
    login: 'Log in',
    secure: 'Secure sign-in via Keycloak',
    redirecting: 'Redirecting you to sign in…',
    redirectingSub: 'One moment while we hand you to secure sign-in.',
    outKicker: 'Signed out',
    out: "You've been signed out.",
    outSub: 'Sign in again to return to the console.',
    expKicker: 'Session expired',
    exp: 'Your session has expired. Please sign in again.',
    support: 'Questions? <a href="mailto:support@erria.dk">support@erria.dk</a>',
  },
  da: {
    productSub: 'Outreach-konsol',
    tagline: 'Intern konsol til gennemgang og afsendelse af AI-genererede kundehenvendelser og håndtering af eskaleringer.',
    login: 'Log ind',
    secure: 'Sikker login via Keycloak',
    redirecting: 'Sender dig videre til login…',
    redirectingSub: 'Et øjeblik – vi sender dig videre til sikkert login.',
    outKicker: 'Logget ud',
    out: 'Du er blevet logget ud.',
    outSub: 'Log ind igen for at vende tilbage til konsollen.',
    expKicker: 'Session udløbet',
    exp: 'Din session er udløbet. Log ind igen.',
    support: 'Spørgsmål? <a href="mailto:support@erria.dk">support@erria.dk</a>',
  },
};

const ICON = {
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v4"/><path d="M12 17h.01"/>',
  lock:  '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  sun:   '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/>',
  moon:  '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
};
const svg = (n, cls) => `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

const VALID = ['landing','redirecting','loggedOut','expired'];
const state = {
  view: 'landing',
  lang: 'en',
  redirecting: false,   // true only during a real "Log in" click (auto-navigates)
};

/* shared brand block — identical across all four states */
function brandBlock(t){
  return `
    <div class="brand" data-od-id="gate-brand">
      <div class="chip"><img src="assets/erria-logo.png" alt="Erria" /></div>
      <div class="wordmark">Erria Outreach Agent<span class="sub">${t.productSub}</span></div>
    </div>`;
}
function cta(t){
  return `
    <button class="btn-login" onclick="login()" data-od-id="btn-login">${t.login} ${svg('arrow')}</button>
    <p class="secure">${svg('lock')} ${t.secure}</p>`;
}

function renderCard(){
  const t = I18N[state.lang];
  let inner;
  if (state.view === 'redirecting'){
    inner = `
      <div class="state" data-od-id="state-redirecting">
        <div class="spin" role="status" aria-live="polite"></div>
        <p class="status">${t.redirecting}</p>
        <p class="sub">${t.redirectingSub}</p>
      </div>`;
  } else if (state.view === 'loggedOut'){
    inner = `
      <div class="state" data-od-id="state-loggedout">
        <span class="kicker ok">${svg('check')} ${t.outKicker}</span>
        <p class="status">${t.out}</p>
        <p class="sub">${t.outSub}</p>
        ${cta(t)}
      </div>`;
  } else if (state.view === 'expired'){
    inner = `
      <div class="state" data-od-id="state-expired">
        <span class="kicker warn">${svg('alert')} ${t.expKicker}</span>
        <p class="status">${t.exp}</p>
        ${cta(t)}
      </div>`;
  } else {
    inner = `
      <div class="state" data-od-id="state-landing">
        <p class="tagline">${t.tagline}</p>
        ${cta(t)}
      </div>`;
  }
  document.getElementById('card').innerHTML = brandBlock(t) + inner;
}

function render(){
  const t = I18N[state.lang];
  document.documentElement.lang = state.lang === 'da' ? 'da' : 'en';
  document.querySelector('.gate').dataset.state = state.view;
  document.getElementById('support').innerHTML = t.support;
  document.querySelectorAll('.lang-toggle button').forEach(b => b.classList.toggle('active', b.dataset.lang === state.lang));
  document.querySelectorAll('.preview button').forEach(b => b.classList.toggle('on', b.dataset.state === state.view && !state.redirecting));
  renderCard();
}

/* single-click login → transition state → (mock) redirect to the console */
let redirectTimer = null;
function login(){
  state.view = 'redirecting';
  state.redirecting = true;
  render();
  clearTimeout(redirectTimer);
  redirectTimer = setTimeout(() => { window.location.href = CONSOLE_URL; }, 1600);
}

function setState(v){
  clearTimeout(redirectTimer);
  state.redirecting = false;
  state.view = VALID.includes(v) ? v : 'landing';
  render();
}

function setLang(l){
  state.lang = (l === 'da') ? 'da' : 'en';
  try { localStorage.setItem('erria-lang', state.lang); } catch(e){}
  render();
}

function toggleTheme(){
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  try { localStorage.setItem('erria-theme', next); } catch(e){}
  paintTheme();
}
function paintTheme(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.getElementById('themeToggle').innerHTML = svg(dark ? 'sun' : 'moon');
}

/* events */
document.addEventListener('click', (e) => {
  const lang = e.target.closest('[data-lang]'); if (lang){ setLang(lang.dataset.lang); return; }
  const prev = e.target.closest('.preview [data-state]'); if (prev){ setState(prev.dataset.state); return; }
  if (e.target.closest('#themeToggle')){ toggleTheme(); return; }
});

/* boot — restore prefs; allow deep-linking a state via ?state= (real app states, not just mock) */
(function(){
  try {
    const th = localStorage.getItem('erria-theme'); if (th) document.documentElement.setAttribute('data-theme', th);
    const lg = localStorage.getItem('erria-lang'); if (lg) state.lang = lg;
  } catch(e){}
  const q = new URLSearchParams(location.search).get('state');
  if (q && VALID.includes(q) && q !== 'redirecting') state.view = q;
  paintTheme();
  render();
})();
</script>
</body>
</html>
