<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Erria Outreach Agent Console</title>
<link rel="icon" href="assets/erria-favicon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Erria Outreach Agent Console — internal human-in-the-loop tool
   Tokens bound from the Erria design system (erria.dk extraction).
   Light is default; [data-theme="dark"] is a designer-authored
   dark extrapolation (no Erria dark precedent — see DESIGN.md).
   ============================================================ */
:root {
  /* base surfaces / text — light theme (extracted) */
  --bg: #ffffff;
  --surface: #f5f4f7;
  --panel: #ffffff;
  --rail: #f7f8fb;
  --border: #ebf0f7;
  --border-strong: #dbe3ef;
  --fg: #0f172a;
  --muted: #5a5a5a;
  --faint: #8a93a3;

  /* brand accent (extracted button/link blue) */
  --brand: #1e73be;
  --brand-strong: #1a66a8;
  --brand-tint: #eaf2fa;
  --on-brand: #ffffff;

  /* status system — paired ALWAYS with a label + icon (never color-alone) */
  --t1-fg: #475569; --t1-bg: #eef2f7; --t1-bd: #cdd8e6;   /* Tier 1 — autonomous, calm */
  --t2-fg: #b45309; --t2-bg: #fdf3e0; --t2-bd: #f0d4a2;   /* Tier 2 — needs approval */
  --t3-fg: #b91c1c; --t3-bg: #fdeceb; --t3-bd: #f2bcb8;   /* Tier 3 — escalated */
  --esc-fg: #b91c1c; --esc-bg: #fdeceb; --esc-bd: #f2bcb8;/* Escalated flag */
  --ok-fg: #15803d; --ok-bg: #e9f6ee; --ok-bd: #bfe3cc;
  --warn-fg: #b45309;

  /* logo chip is ALWAYS dark navy (only a transparent-white mark exists) */
  --chip: #0f172a;

  --radius: 8px;
  --radius-sm: 6px;
  --shadow-card: 0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.04);
  --shadow-pop: 0 12px 28px rgba(15,23,42,.14), 0 4px 8px rgba(15,23,42,.08);
  --shadow-btn: 0 1px 0 rgba(15,23,42,.06), 0 2px 6px rgba(30,115,190,.28);

  --font: "Inter", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
[data-theme="dark"] {
  --bg: #0f172a;
  --surface: #1a2438;
  --panel: #151f33;
  --rail: #131c2e;
  --border: #2a3650;
  --border-strong: #37456180;
  --fg: #f5f4f7;
  --muted: #9aa3b2;
  --faint: #6b7688;

  --brand: #4a9bd8;
  --brand-strong: #5aa8e0;
  --brand-tint: #16304a;
  --on-brand: #08111f;

  --t1-fg: #94a3b8; --t1-bg: #1c2740; --t1-bd: #33415c;
  --t2-fg: #fbbf24; --t2-bg: #362a12; --t2-bd: #5c4a1e;
  --t3-fg: #f87171; --t3-bg: #3a1e20; --t3-bd: #63302f;
  --esc-fg: #f87171; --esc-bg: #3a1e20; --esc-bd: #63302f;
  --ok-fg: #4ade80; --ok-bg: #15301f; --ok-bd: #275033;
  --warn-fg: #fbbf24;

  --shadow-card: 0 1px 2px rgba(0,0,0,.4);
  --shadow-pop: 0 16px 40px rgba(0,0,0,.55);
  --shadow-btn: 0 1px 0 rgba(0,0,0,.3), 0 2px 8px rgba(74,155,216,.35);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button { font-family: inherit; cursor: pointer; }
/* Base icon size — every inline <svg> is an icon; without this, unconstrained
   svgs fall back to the SVG default (~300×150) and render as huge blobs.
   Component rules below (.btn svg, .eb-icon svg, …) override where needed. */
svg { width: 16px; height: 16px; vertical-align: -0.15em; }
::selection { background: color-mix(in oklch, var(--brand) 25%, transparent); }

/* ---------- App layout ---------- */
.app { display: grid; grid-template-columns: 230px 1fr; height: 100vh; }

/* ---------- Sidebar rail ---------- */
.rail {
  background: var(--rail);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 16px 12px;
  gap: 4px;
}
.brand {
  display: flex; align-items: center; gap: 11px;
  padding: 4px 6px 16px;
}
.brand-chip {
  width: 40px; height: 40px; flex: 0 0 auto;
  background: var(--chip);
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  padding: 7px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
}
.brand-chip img { width: 100%; height: 100%; object-fit: contain; }
.brand-name { font-weight: 700; font-size: 14px; letter-spacing: -.01em; line-height: 1.15; }
.brand-sub { font-size: 11px; color: var(--faint); line-height: 1.2; margin-top: 1px; }

.nav-label { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 14px 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  border: 1px solid transparent; background: transparent;
  color: var(--muted);
  padding: 9px 10px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500;
  transition: background .12s, color .12s;
}
.nav-item:hover { background: color-mix(in oklch, var(--fg) 5%, transparent); color: var(--fg); }
.nav-item.active { background: var(--brand-tint); color: var(--brand-strong); border-color: color-mix(in oklch, var(--brand) 24%, transparent); font-weight: 600; }
.nav-item svg { width: 17px; height: 17px; flex: 0 0 auto; }
.nav-item .count { margin-left: auto; font-size: 11px; font-weight: 600; font-family: var(--mono); background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 1px 7px; border-radius: 999px; }
.nav-item.attention .count { background: var(--esc-bg); border-color: var(--esc-bd); color: var(--esc-fg); }
/* Send Audit count is orientation, not a to-do — muted dashed outline, visibly not an actionable pill */
.nav-item .count.sample-count { background: transparent; border-style: dashed; border-color: var(--border-strong); color: var(--faint); font-weight: 500; }
.rail-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
.rail-user { display: flex; align-items: center; gap: 10px; padding: 6px 8px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: var(--on-brand); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex: 0 0 auto; }
.rail-user .who { font-size: 12px; font-weight: 600; line-height: 1.2; }
.rail-user .role { font-size: 11px; color: var(--faint); }

/* ---------- Main column ---------- */
.main { display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in oklch, var(--bg) 86%, transparent);
  backdrop-filter: blur(8px);
}
.crumb { font-size: 12px; color: var(--faint); }
.crumb b { color: var(--fg); font-weight: 600; }
.page-title { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.topbar .spacer { flex: 1; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 11px; color: var(--muted); font-size: 13px; width: 240px; }
.search svg { width: 15px; height: 15px; flex: 0 0 auto; }
.search input { border: 0; background: transparent; color: var(--fg); font: inherit; outline: none; width: 100%; }
.search input::placeholder { color: var(--faint); }
.theme-toggle {
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--border); background: var(--panel); color: var(--muted);
  padding: 7px 10px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 500;
}
.theme-toggle:hover { border-color: var(--border-strong); color: var(--fg); }
.theme-toggle svg { width: 15px; height: 15px; }

.scroll { flex: 1; overflow-y: auto; padding: 24px; }
.scroll.split { padding: 0; }

/* ---------- Shared bits ---------- */
.section-head { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
.section-head h2 { font-size: 13px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.section-head .hint { font-size: 12px; color: var(--faint); }
.divider-note { font-size: 12px; color: var(--muted); margin: 2px 0 14px; max-width: 62ch; }

/* badges: color + icon + text (never color-alone) */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600; letter-spacing: .01em;
  padding: 3px 8px 3px 7px; border-radius: 999px;
  border: 1px solid transparent; white-space: nowrap;
}
.badge svg { width: 12px; height: 12px; flex: 0 0 auto; }
.badge.t1 { color: var(--t1-fg); background: var(--t1-bg); border-color: var(--t1-bd); }
.badge.t2 { color: var(--t2-fg); background: var(--t2-bg); border-color: var(--t2-bd); }
.badge.t3 { color: var(--t3-fg); background: var(--t3-bg); border-color: var(--t3-bd); }
.badge.esc { color: var(--esc-fg); background: var(--esc-bg); border-color: var(--esc-bd); }
.badge.ok { color: var(--ok-fg); background: var(--ok-bg); border-color: var(--ok-bd); }
.badge.ghost { color: var(--muted); background: var(--surface); border-color: var(--border); }

/* ICP fit meter */
.icp { display: inline-flex; align-items: center; gap: 8px; }
.icp-bars { display: inline-flex; gap: 2px; }
.icp-bars i { width: 5px; height: 13px; border-radius: 1px; background: var(--border-strong); display: inline-block; }
.icp.high .icp-bars i:nth-child(-n+3) { background: var(--ok-fg); }
.icp.med .icp-bars i:nth-child(-n+2) { background: var(--warn-fg); }
.icp.low .icp-bars i:nth-child(-n+1) { background: var(--t3-fg); }
.icp .icp-label { font-size: 11px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }

/* rationale line — always paired with a tier badge */
.why { display: flex; align-items: baseline; gap: 6px; font-size: 12px; color: var(--muted); line-height: 1.35; }
.why svg { width: 12px; height: 12px; flex: 0 0 auto; transform: translateY(1px); color: var(--faint); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--border-strong); background: var(--panel); color: var(--fg); padding: 8px 13px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; transition: background .12s, border-color .12s, transform .05s; }
.btn:hover { border-color: var(--faint); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 15px; height: 15px; }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); box-shadow: var(--shadow-btn); }
.btn.primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
.btn.danger { color: var(--t3-fg); border-color: var(--t3-bd); background: var(--t3-bg); }
.btn.danger:hover { border-color: var(--t3-fg); }
.btn.warn { color: var(--t2-fg); border-color: var(--t2-bd); background: var(--t2-bg); }
.btn.warn:hover { border-color: var(--t2-fg); }
.btn.block { width: 100%; }
kbd { font-family: var(--mono); font-size: 10.5px; font-weight: 600; background: color-mix(in oklch, currentColor 12%, transparent); border: 1px solid color-mix(in oklch, currentColor 22%, transparent); border-radius: 4px; padding: 1px 5px; line-height: 1.4; }

/* ================= SCREEN 1 — Account queue ================= */
.filters { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
.chip:hover { border-color: var(--border-strong); color: var(--fg); }
.chip.active { background: var(--fg); border-color: var(--fg); color: var(--bg); }
/* count pill — matches the sidebar nav badge treatment (Fix 1) */
.chip .n { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 11px; font-weight: 600; background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 1px 7px; border-radius: 999px; margin-left: 2px; }
.chip:hover .n { color: var(--fg); }
.chip.active .n { background: color-mix(in oklch, var(--bg) 22%, transparent); border-color: transparent; color: var(--bg); }

.group { margin-bottom: 22px; }
.group-head { display: flex; align-items: center; gap: 10px; padding: 0 2px 9px; }
.group-head .g-title { font-size: 12px; font-weight: 700; letter-spacing: .01em; }
.group-head .g-desc { font-size: 12px; color: var(--faint); }
.group-head .g-count { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--muted); font-family: var(--mono); }

.q-table { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--panel); box-shadow: var(--shadow-card); }
.q-head, .q-row { display: grid; grid-template-columns: 2.3fr 2.6fr 1fr 1.1fr 1.2fr; gap: 16px; align-items: center; padding: 12px 16px; }
.q-head { font-size: 10.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); background: var(--surface); border-bottom: 1px solid var(--border); padding-top: 9px; padding-bottom: 9px; }
.q-row { border-bottom: 1px solid var(--border); transition: background .1s; cursor: pointer; position: relative; }
.q-row:last-child { border-bottom: 0; }
.q-row:hover { background: color-mix(in oklch, var(--brand) 5%, transparent); }
.q-row.needs { box-shadow: inset 3px 0 0 var(--t2-fg); }
.q-row.esc { box-shadow: inset 3px 0 0 var(--t3-fg); background: color-mix(in oklch, var(--t3-fg) 4%, transparent); }
.q-row.calm { opacity: .92; }
.q-row.approved { box-shadow: inset 3px 0 0 var(--ok-fg); }
.acct { min-width: 0; }
.acct .co { font-weight: 600; font-size: 13.5px; letter-spacing: -.01em; display: flex; align-items: center; gap: 7px; }
.acct .vessel { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; margin-top: 2px; }
.acct .vessel svg { width: 12px; height: 12px; color: var(--faint); }
.trigger { font-size: 12.5px; color: var(--fg); min-width: 0; }
.trigger .tline { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tier-cell { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.tier-cell .why { font-size: 11px; }
.time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rowcta { display: flex; justify-content: flex-end; }
.q-row .go { color: var(--faint); display: inline-flex; }
.q-row:hover .go { color: var(--brand); }

/* ================= SCREEN 2 — Review split ================= */
.split-wrap { display: grid; grid-template-columns: 1fr 380px; height: 100%; min-height: 0; }
.split-main { overflow-y: auto; padding: 22px 24px; border-right: 1px solid var(--border); min-width: 0; }
.dossier { overflow-y: auto; padding: 20px; background: var(--rail); min-width: 0; }

.review-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
.review-head .rh-main { min-width: 0; flex: 1; }
.review-head h1 { font-size: 19px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.015em; }
.review-head .sub { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.review-head .sub svg { width: 13px; height: 13px; color: var(--faint); }

.thread { display: flex; flex-direction: column; gap: 14px; margin-bottom: 4px; }
.msg { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; background: var(--panel); }
.msg .m-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; }
.msg .m-who { font-weight: 600; color: var(--fg); }
.msg .m-when { color: var(--faint); margin-left: auto; font-variant-numeric: tabular-nums; }
.msg .m-body { font-size: 13.5px; line-height: 1.6; color: var(--fg); }
.msg.inbound { background: var(--surface); }
.msg.draft { border-color: var(--brand-tint); box-shadow: 0 0 0 1px var(--brand-tint); }
.draft-flag { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--brand-strong); }
.draft-flag svg { width: 13px; height: 13px; }

.draft-edit { width: 100%; border: 1px solid var(--brand); border-radius: var(--radius-sm); background: var(--bg); color: var(--fg); font: inherit; font-size: 13.5px; line-height: 1.6; padding: 12px 14px; resize: vertical; min-height: 150px; outline: none; }
.draft-edit:focus { box-shadow: 0 0 0 3px var(--brand-tint); }

/* hard-rule / policy tags below draft */
.policy-tags { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 4px; }
.policy-tag { display: flex; align-items: flex-start; gap: 9px; font-size: 12px; padding: 9px 12px; border-radius: var(--radius-sm); border: 1px solid var(--t2-bd); background: var(--t2-bg); color: var(--t2-fg); }
.policy-tag svg { width: 14px; height: 14px; flex: 0 0 auto; transform: translateY(1px); }
.policy-tag b { font-weight: 700; }
.policy-tag .pt-body { color: var(--fg); font-weight: 400; }
.policy-tag.info { border-color: var(--border); background: var(--surface); color: var(--muted); }
.policy-tag.info svg { color: var(--brand); }
.policy-tag.hard { border-left-width: 3px; border-left-color: var(--t2-fg); box-shadow: 0 1px 2px rgba(0,0,0,.05); padding: 11px 13px; }
.policy-tag.hard svg { color: var(--t2-fg); }

/* decision bar — the most prominent element on the screen */
.decision {
  position: sticky; bottom: 0;
  margin: 20px -24px -22px; padding: 16px 24px;
  background: color-mix(in oklch, var(--panel) 92%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.decision .d-lead { font-size: 12px; color: var(--muted); margin-right: auto; display: flex; align-items: center; gap: 8px; }
.decision .d-lead svg { width: 14px; height: 14px; color: var(--brand); }
.decision .btn.primary { padding: 10px 20px; font-size: 13.5px; }
.decision-done { display: flex; align-items: center; gap: 10px; margin-right: auto; font-weight: 600; font-size: 13px; }
.decision-done.approved { color: var(--ok-fg); }
.decision-done.rejected { color: var(--t3-fg); }
.decision-done svg { width: 18px; height: 18px; }

/* dossier */
.dossier h3 { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin: 0 0 12px; display: flex; align-items: center; gap: 7px; }
.dossier h3 svg { width: 13px; height: 13px; }
.doss-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px; margin-bottom: 14px; box-shadow: var(--shadow-card); }
.doss-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.doss-row:last-child { border-bottom: 0; }
.doss-row .k { color: var(--muted); flex: 0 0 auto; }
.doss-row .v { text-align: right; font-weight: 600; }
.contact-block { display: flex; align-items: center; gap: 11px; }
.contact-block .avatar { width: 34px; height: 34px; font-size: 12px; background: var(--surface); color: var(--brand-strong); border: 1px solid var(--border); }
.contact-block .cb-name { font-weight: 700; font-size: 13px; }
.contact-block .cb-role { font-size: 11.5px; color: var(--muted); }

.tier-panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px; margin-bottom: 14px; box-shadow: var(--shadow-card); }
.tier-panel .tp-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.tier-panel .tp-top .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
.tier-panel .tp-why { font-size: 12.5px; color: var(--fg); line-height: 1.5; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); border-left: 3px solid var(--t2-fg); }
.progress-dots { display: flex; align-items: center; gap: 6px; margin-top: 11px; font-size: 11.5px; color: var(--muted); }
.progress-dots .pd { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--border-strong); }
.progress-dots .pd.on { background: var(--ok-fg); border-color: var(--ok-fg); }

.trust-block { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-sm); padding: 10px 12px; }
.trust-head { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; color: var(--fg); margin-bottom: 6px; }
.trust-head svg { width: 13px; height: 13px; color: var(--brand); }
.confidence { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.dot.hi { background: var(--ok-fg); } .dot.mid { background: var(--warn-fg); } .dot.lo { background: var(--t3-fg); }

/* ================= SCREEN 3 — Escalation console ================= */
.esc-switch { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.esc-pill { display: flex; align-items: center; gap: 9px; border: 1px solid var(--border); background: var(--panel); border-radius: var(--radius); padding: 9px 13px; text-align: left; min-width: 0; }
.esc-pill:hover { border-color: var(--esc-bd); }
.esc-pill.active { border-color: var(--esc-fg); background: var(--esc-bg); box-shadow: 0 0 0 1px var(--esc-fg); }
.esc-pill .ep-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--esc-fg); flex: 0 0 auto; }
.esc-pill .ep-co { font-size: 12.5px; font-weight: 600; }
.esc-pill .ep-reason { font-size: 11px; color: var(--muted); }

.esc-banner {
  display: flex; align-items: flex-start; gap: 14px;
  border: 1px solid var(--esc-bd); background: var(--esc-bg);
  border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px;
  box-shadow: 0 0 0 1px color-mix(in oklch, var(--esc-fg) 18%, transparent);
}
.esc-banner .eb-icon { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 9px; background: color-mix(in oklch, var(--esc-fg) 16%, transparent); color: var(--esc-fg); display: flex; align-items: center; justify-content: center; }
.esc-banner .eb-icon svg { width: 22px; height: 22px; }
.esc-banner .eb-kick { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--esc-fg); }
.esc-banner .eb-reason { font-size: 16px; font-weight: 700; letter-spacing: -.01em; margin: 3px 0 5px; }
.esc-banner .eb-detail { font-size: 12.5px; color: var(--fg); max-width: 70ch; }
.esc-banner .eb-meta { margin-left: auto; text-align: right; font-size: 11.5px; color: var(--muted); flex: 0 0 auto; }

.next-step { border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); padding: 16px; margin-bottom: 18px; box-shadow: var(--shadow-card); }
.next-step .ns-head { display: flex; align-items: center; gap: 8px; margin-bottom: 11px; }
.next-step .ns-head .ns-title { font-size: 13px; font-weight: 700; }
.next-step .ns-head .ns-tag { margin-left: auto; }
.next-step .ns-body { font-size: 13.5px; line-height: 1.55; color: var(--fg); padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--brand); border-radius: var(--radius-sm); }
.ns-edit { width: 100%; border: 1px solid var(--brand); border-radius: var(--radius-sm); background: var(--bg); color: var(--fg); font: inherit; font-size: 13.5px; line-height: 1.55; padding: 12px 14px; resize: vertical; min-height: 90px; outline: none; }
.ns-actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.no-send { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-left: auto; }
.no-send svg { width: 15px; height: 15px; color: var(--faint); }

/* human action bar — the visible "what should I do" control */
.esc-actionbar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; margin-bottom: 22px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow-card); }
.esc-actionbar .ea-lead { font-size: 12.5px; font-weight: 600; color: var(--fg); margin-right: auto; display: flex; align-items: center; gap: 8px; }
.esc-actionbar .ea-lead svg { width: 15px; height: 15px; color: var(--brand); }
.esc-actionbar .btn.primary { padding: 10px 18px; }
.esc-actionbar.done { border-color: var(--ok-bd); background: var(--ok-bg); }
.esc-actionbar .ea-done { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; color: var(--ok-fg); margin-right: auto; }
.esc-actionbar .ea-done svg { width: 18px; height: 18px; }

/* ================= SCREEN 4 — Audit timeline ================= */
.audit-pick { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.audit-pick label { font-size: 12px; color: var(--muted); }
.audit-pick select { font: inherit; font-size: 13px; font-weight: 600; color: var(--fg); background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 8px 12px; outline: none; }
.audit-card { max-width: 780px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 24px 20px; box-shadow: var(--shadow-card); }
.timeline { position: relative; margin: 6px 0 0; padding-left: 8px; }
.tl-item { position: relative; padding: 16px 0 16px 34px; border-left: 2px solid var(--border); }
.tl-item:last-child { border-left-color: transparent; }
.tl-item::before { content: ""; position: absolute; left: -8px; top: 20px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 2px solid var(--border-strong); }
.tl-item.promote::before { border-color: var(--ok-fg); background: var(--ok-bg); }
.tl-item.demote::before, .tl-item.escalate::before { border-color: var(--t3-fg); background: var(--t3-bg); }
.tl-item.create::before { border-color: var(--brand); background: var(--brand-tint); }
.tl-item.current::before { border-color: var(--t2-fg); background: var(--t2-bg); box-shadow: 0 0 0 4px var(--t2-bg); }
.tl-when { font-size: 11px; font-weight: 600; color: var(--faint); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.tl-title { display: flex; align-items: center; gap: 9px; margin: 4px 0 5px; }
.tl-title .tt { font-size: 13.5px; font-weight: 600; }
.tl-reason { font-size: 12.5px; color: var(--muted); line-height: 1.5; max-width: 62ch; }

/* toast */
.toast-wrap { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { display: flex; align-items: center; gap: 10px; background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; box-shadow: var(--shadow-pop); animation: rise .22s ease; }
.toast svg { width: 16px; height: 16px; }
.toast.ok svg { color: #4ade80; }
.toast.warn svg { color: #fbbf24; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 12px; color: var(--muted); text-align: center; padding: 40px; }
.empty svg { width: 34px; height: 34px; color: var(--faint); }
.empty .btn { margin-top: 6px; }

/* thread + section-head icons stay small and inline */
.msg .m-head svg { width: 14px; height: 14px; }
.ns-head svg { width: 15px; height: 15px; color: var(--brand); }

/* ---------- pagination ---------- */
.pager { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 4px 2px; }
.pager .p-info { font-size: 12px; color: var(--muted); margin-right: auto; font-variant-numeric: tabular-nums; }
.pager .p-btns { display: flex; align-items: center; gap: 4px; }
.pager button { min-width: 32px; height: 32px; padding: 0 9px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pager button:hover:not(:disabled) { border-color: var(--border-strong); color: var(--fg); }
.pager button.on { background: var(--brand-tint); border-color: color-mix(in oklch, var(--brand) 24%, transparent); color: var(--brand-strong); }
.pager button:disabled { opacity: .4; cursor: default; }
.pager .p-ell { color: var(--faint); padding: 0 2px; }

/* worklist intro line */
.worklist-note { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }
.worklist-note svg { color: var(--brand); }

/* ---------- Account Detail ---------- */
.detail-top { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 20px; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); border-radius: var(--radius-sm); padding: 7px 11px; font-size: 12.5px; font-weight: 600; flex: 0 0 auto; }
.back-btn:hover { border-color: var(--border-strong); color: var(--fg); }
.back-btn svg { transform: scaleX(-1); }
.detail-hd { min-width: 0; flex: 1; }
.detail-hd h1 { font-size: 20px; font-weight: 700; letter-spacing: -.015em; margin: 0 0 4px; }
.detail-hd .sub { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.detail-hd .sub svg { width: 13px; height: 13px; color: var(--faint); }

.detail-grid { display: grid; grid-template-columns: 1fr 344px; gap: 22px; align-items: start; }
.detail-col { min-width: 0; }
.detail-rail { min-width: 0; position: sticky; top: 8px; }
.detail-section { margin-bottom: 26px; }
.detail-section > .sh { display: flex; align-items: center; gap: 9px; margin: 0 0 13px; padding-bottom: 9px; border-bottom: 1px solid var(--border); }
.detail-section > .sh .st { font-size: 13px; font-weight: 700; letter-spacing: -.01em; }
.detail-section > .sh .sk { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
.detail-section > .sh svg { width: 15px; height: 15px; color: var(--brand); }
.detail-section > .sh .sh-right { margin-left: auto; }
.detail-full { margin-top: 8px; }

/* Account Detail — section tabs */
.detail-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 24px; overflow-x: auto; }
.detail-tab { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; padding: 11px 15px; border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.detail-tab:hover { color: var(--fg); }
.detail-tab.active { color: var(--brand-strong); border-bottom-color: var(--brand); }
.detail-tab svg { width: 15px; height: 15px; }
.detail-tab .tcount { font-family: var(--mono); font-size: 11px; font-weight: 600; background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 0 6px; border-radius: 999px; }
.detail-tab.active .tcount { background: var(--brand-tint); border-color: transparent; color: var(--brand-strong); }
.detail-tab .tdot { width: 7px; height: 7px; border-radius: 50%; background: var(--t2-fg); flex: 0 0 auto; }
.detail-tab .tdot.red { background: var(--t3-fg); }
.detail-panel { animation: fadein .16s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
/* working tab reads in a comfortable column (no side rail now) */
.detail-narrow { max-width: 820px; }
/* Account info tab — dossier laid out as a 2-column card grid */
.info-wrap .dossier { background: transparent; padding: 0; position: static; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; max-width: 920px; }
.info-wrap .dossier > h3 { display: none; }
.info-wrap .doss-card, .info-wrap .tier-panel { margin-bottom: 0; }
@media (max-width: 720px){ .info-wrap .dossier { grid-template-columns: 1fr; } }

/* ===================== v4 — repeat-escalation, Send Audit, Settings ===================== */
.nav-label + .nav-item { }
.rail-foot .nav-item { margin-bottom: 6px; }

/* repeat-escalation link + banner (Fix 2) */
/* repeat-escalation link — a deliberate, non-skimmable card (not a faint aside),
   but without the red urgency of the hard-trigger banner below it */
.repeat-link { border: 1px solid var(--brand); background: var(--brand-tint); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; box-shadow: var(--shadow-card); }
.repeat-link .rl-top { display: flex; align-items: center; gap: 8px; }
.repeat-link .rl-top svg { color: var(--brand-strong); width: 16px; height: 16px; }
.repeat-link .rl-title { font-size: 13px; font-weight: 700; color: var(--fg); }
.repeat-link .rl-sub { font-size: 12px; color: var(--muted); margin: 6px 0 11px; line-height: 1.45; }
.repeat-link .rl-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.repeat-link select { font: inherit; font-size: 12.5px; font-weight: 600; color: var(--fg); background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 8px 11px; min-width: 250px; }
.repeat-link .rl-preview { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; line-height: 1.45; color: var(--fg); margin-top: 11px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.repeat-link .rl-preview svg { color: var(--brand); flex: 0 0 auto; margin-top: 1px; }

/* ---- manual tier override ---- */
.detail-tier { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; flex: 0 0 auto; }
.tier-change-link { display: inline-flex; align-items: center; gap: 5px; border: 0; background: transparent; color: var(--brand-strong); font-size: 12px; font-weight: 600; padding: 0; }
.tier-change-link svg { width: 13px; height: 13px; }
.tier-change-link:hover { text-decoration: underline; }
.tier-panel-inline { border: 1px solid var(--brand); background: var(--brand-tint); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 22px; box-shadow: var(--shadow-card); animation: rise .18s ease; }
.tier-panel-inline .tp-hd { font-size: 12.5px; color: var(--fg); margin-bottom: 15px; display: flex; align-items: flex-start; gap: 8px; line-height: 1.45; }
.tier-panel-inline .tp-hd svg { color: var(--brand-strong); flex: 0 0 auto; margin-top: 1px; }
.tp-body { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
.tp-field { display: flex; flex-direction: column; gap: 8px; }
.tp-field:nth-child(2) { flex: 1; min-width: 300px; }
.tp-label { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.tp-label em { font-style: normal; color: var(--t3-fg); font-weight: 700; text-transform: none; letter-spacing: 0; }
.tier-choices { display: flex; gap: 8px; }
.tier-choice { display: inline-flex; border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 5px; }
.tier-choice:hover { border-color: var(--border-strong); }
.tier-choice.sel { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-tint); }
.tp-reason { font: inherit; font-size: 13px; color: var(--fg); background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 9px 12px; width: 100%; outline: none; }
.tp-reason:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
.tp-reason.err { border-color: var(--t3-fg); box-shadow: 0 0 0 3px color-mix(in oklch, var(--t3-fg) 15%, transparent); }
.tp-err { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--t3-fg); font-weight: 600; }
.tp-err svg { width: 12px; height: 12px; }
.tp-actions { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.tp-note { font-size: 11.5px; color: var(--muted); }
/* manual Tier History entry — visibly distinct from automatic entries */
.tl-item.manual::before { border-color: var(--brand); background: var(--brand-tint); }
.tl-manual { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--brand-strong); background: var(--brand-tint); border: 1px solid color-mix(in oklch, var(--brand) 26%, transparent); border-radius: 999px; padding: 2px 8px; }
.tl-manual svg { width: 11px; height: 11px; }
.repeat-banner { display: flex; align-items: flex-start; gap: 12px; border: 1px solid var(--warn-bd); background: var(--warn-bg); border-radius: var(--radius); padding: 12px 15px; margin-bottom: 14px; box-shadow: 0 0 0 1px color-mix(in oklch, var(--warn-fg) 15%, transparent); }
.repeat-banner > svg { color: var(--warn-fg); width: 18px; height: 18px; margin-top: 1px; }
.repeat-banner .rb-main { flex: 1; min-width: 0; }
.repeat-banner .rb-kick { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--warn-fg); }
.repeat-banner .rb-text { font-size: 12.5px; color: var(--fg); margin-top: 3px; line-height: 1.45; }

/* Send Audit */
.sa-stats { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.sa-stat { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; }
.sa-stat svg { width: 14px; height: 14px; }
.sa-stat.ok { color: var(--ok-fg); } .sa-stat.warn { color: var(--t3-fg); } .sa-stat.mut { color: var(--faint); }
.q-head.sa-head, .q-row.sa-row { grid-template-columns: 2.2fr 2.2fr 1fr 0.8fr 1.5fr; }
.sa-rowwrap { border-bottom: 1px solid var(--border); }
.sa-rowwrap:last-child { border-bottom: 0; }
.sa-rowwrap.flagged { box-shadow: inset 3px 0 0 var(--t3-fg); background: color-mix(in oklch, var(--t3-fg) 4%, transparent); }
.sa-row { border-bottom: 0 !important; }
.sa-actions { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
.sa-actions .btn.ok-on { color: var(--ok-fg); border-color: var(--ok-bd); background: var(--ok-bg); }
.sa-actions .btn.warn-on { color: var(--t3-fg); border-color: var(--t3-bd); background: var(--t3-bg); }
.sa-exp { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); border-radius: var(--radius-sm); }
.sa-exp:hover { color: var(--fg); border-color: var(--border-strong); }
.sa-body { padding: 4px 16px 16px 16px; background: color-mix(in oklch, var(--surface) 55%, transparent); }
.sa-body-label { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 6px 0 8px; }
.sa-body-label svg { color: var(--brand); }
.sa-body .msg { max-width: 760px; }

/* Settings */
.settings-wrap { max-width: 820px; display: flex; flex-direction: column; gap: 18px; }
.set-sec { border: 1px solid var(--border); background: var(--panel); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow-card); }
.set-sec.locked { background: var(--surface); border-style: solid; }
.set-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.set-badge { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; color: var(--fg); }
.set-badge svg { width: 15px; height: 15px; color: var(--brand); }
.set-badge.alt svg { color: var(--warn-fg); }
.set-badge.lock { color: var(--muted); } .set-badge.lock svg { color: var(--faint); }
.set-sub { font-size: 12px; color: var(--faint); }
.set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field .fl { font-size: 12.5px; font-weight: 600; color: var(--fg); }
.field .fh { font-size: 11.5px; color: var(--muted); line-height: 1.4; margin-bottom: 3px; }
.field input[type=number] { font: inherit; font-size: 14px; font-weight: 600; color: var(--fg); background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 9px 12px; width: 120px; outline: none; }
.field input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-tint); }
.input-suffix { display: inline-flex; align-items: center; gap: 0; position: relative; width: 120px; }
.input-suffix input { width: 100%; padding-right: 30px; }
.input-suffix i { position: absolute; right: 12px; font-style: normal; color: var(--muted); font-weight: 600; font-size: 13px; }
.seg { display: inline-flex; gap: 2px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 3px; width: fit-content; }
.seg button { border: 0; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 600; padding: 6px 14px; border-radius: 4px; }
.seg button:hover { color: var(--fg); }
.seg button.on { background: var(--brand); color: var(--on-brand); }
.set-save { display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
.set-hint { font-size: 12px; color: var(--warn-fg); font-weight: 600; }
.set-hint.ok { color: var(--ok-fg); display: inline-flex; align-items: center; gap: 5px; }
.set-hint.ok svg { width: 14px; height: 14px; }
.set-expander { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 0; text-align: left; }
.set-expander svg:first-child { color: var(--faint); transition: transform .16s; }
.set-expander.open svg:first-child { transform: rotate(180deg); }
.set-adv-body { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.set-save-col { align-items: stretch; }
.confirm-inline { display: flex; flex-direction: column; gap: 9px; font-size: 12.5px; color: var(--fg); background: var(--warn-bg); border: 1px solid var(--warn-bd); border-radius: var(--radius-sm); padding: 13px 15px; width: 100%; animation: rise .18s ease; }
.confirm-inline .ci-head { display: flex; align-items: center; gap: 7px; font-weight: 700; color: var(--warn-fg); }
.confirm-inline .ci-head svg { color: var(--warn-fg); }
.confirm-inline .ci-list { margin: 0; padding: 0 0 0 2px; list-style: none; display: flex; flex-direction: column; gap: 5px; }
.confirm-inline .ci-list li { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--fg); padding: 6px 10px; background: var(--panel); border: 1px solid var(--warn-bd); border-radius: var(--radius-sm); }
.confirm-inline .ci-note { font-size: 11.5px; color: var(--muted); }
.confirm-inline .ci-actions { display: flex; gap: 8px; margin-top: 2px; }
/* locked rows */
.lock-list { display: flex; flex-direction: column; gap: 8px; }
.lock-row { display: flex; align-items: flex-start; gap: 12px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 14px; opacity: .92; }
.lock-row > div:first-child svg { color: var(--faint); }
.lock-row .lr-main { flex: 1; min-width: 0; }
.lock-row .lr-name { font-size: 12.5px; font-weight: 600; color: var(--fg); }
.lock-row .lr-desc { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.lock-row .lr-note { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 600; color: var(--faint); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; white-space: nowrap; flex: 0 0 auto; }
.lock-row .lr-note svg { width: 11px; height: 11px; }
@media (max-width: 720px){ .set-grid { grid-template-columns: 1fr; } }

/* decision bar inside Account Detail is a bordered card, not a sticky footer */
.decision.detail-decision { position: static; margin: 18px 0 0; padding: 14px 16px; border: 1px solid var(--border-strong); border-top: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow-card); backdrop-filter: none; flex-wrap: wrap; }

/* calm "no action needed" state */
.calm-state { border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); padding: 16px; box-shadow: var(--shadow-card); }

/* ---------- Resolution & Outcome ---------- */
.res-row { display: grid; grid-template-columns: 1.4fr 1.7fr 0.9fr 0.8fr; gap: 14px; align-items: start; padding: 13px 15px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow-card); margin-bottom: 10px; }
.res-row .rk { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; }
.res-row .rv { font-size: 12.5px; color: var(--fg); line-height: 1.45; }
.res-row .rv.mut { color: var(--muted); }
.res-row .rv .rt { font-family: var(--mono); font-size: 11.5px; color: var(--muted); display: block; margin-top: 3px; }
.badge.win { color: var(--ok-fg); background: var(--ok-bg); border-color: var(--ok-bd); }
.badge.reeng { color: var(--brand-strong); background: var(--brand-tint); border-color: color-mix(in oklch, var(--brand) 26%, transparent); }
.badge.noresp { color: var(--muted); background: var(--surface); border-color: var(--border); }
.badge.churn { color: var(--esc-fg); background: var(--esc-bg); border-color: var(--esc-bd); }
.res-empty { font-size: 12.5px; color: var(--muted); border: 1px dashed var(--border-strong); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 9px; }
.res-empty svg { color: var(--faint); }

@media (max-width: 1080px) {
  .detail-grid { grid-template-columns: 1fr; }
  .detail-rail { position: static; }
  .res-row { grid-template-columns: 1fr 1fr; }
  .split-wrap { grid-template-columns: 1fr; }
  .dossier { border-top: 1px solid var(--border); }
  .q-head, .q-row { grid-template-columns: 2fr 2fr 1.2fr 1.2fr; }
  .q-head .col-icp, .q-row .icp-col { display: none; }
}

/* recency in minutes, parsed from the "12m/2h/1d ago" display string */
function ageMinutes(a){
  const m = /^(\d+)\s*([mhd])/.exec(a.time || '');
  if (!m) return 99999;
  const n = +m[1];
  return m[2]==='m' ? n : m[2]==='h' ? n*60 : n*1440;
}
/* default sort: Tier 2 & 3 (action-needed) before Tier 1, then most-recent */
function queueSorted(list){
  return list.slice().sort((x,y) => {
    const px = x.tier===1?1:0, py = y.tier===1?1:0;
    if (px !== py) return px - py;
    return ageMinutes(x) - ageMinutes(y);
  });
}
function rowClassFor(a){
  const decided = state.decisions[a.id];
  if (decided === 'approved') return 'approved';
  if (decided === 'rejected') return 'calm';
  return a.tier===3 ? 'esc' : a.tier===2 ? 'needs' : 'calm';
}

/* ---------- Screen 1: Queue (one flat, sorted, paginated list) ---------- */
function renderQueue(){
  const counts = { 1:0,2:0,3:0 };
  ACCOUNTS.forEach(a => counts[a.tier]++);

  const chips = `
    <div class="filters" data-od-id="queue-filters">
      <button class="chip ${state.filter==='all'?'active':''}" data-filter="all">All <span class="n">${ACCOUNTS.length}</span></button>
      <button class="chip ${state.filter==='1'?'active':''}" data-filter="1">${svg('robot')} Tier 1 <span class="n">${counts[1]}</span></button>
      <button class="chip ${state.filter==='2'?'active':''}" data-filter="2">${svg('pencil')} Tier 2 <span class="n">${counts[2]}</span></button>
      <button class="chip ${state.filter==='3'?'active':''}" data-filter="3">${svg('escalation')} Tier 3 <span class="n">${counts[3]}</span></button>
    </div>`;

  const all = queueSorted(ACCOUNTS.filter(a => state.filter==='all' || a.tier===+state.filter));
  const pages = Math.max(1, Math.ceil(all.length / PER_PAGE));
  if (state.page > pages) state.page = pages;
  const start = (state.page - 1) * PER_PAGE;
  const rows = all.slice(start, start + PER_PAGE);

  const table = `
    <div class="q-table" data-od-id="queue-table">
      <div class="q-head">
        <div>Account / Vessel</div><div>Trigger</div><div class="col-icp">ICP fit</div><div>Tier & why</div><div>Last action</div>
      </div>
      ${rows.map(a => queueRow(a)).join('')}
    </div>`;

  return chips + table + pager(all.length, pages, start, rows.length);
}
function pager(total, pages, start, shown){
  const btn = (p, label, on, dis) => `<button class="${on?'on':''}" ${dis?'disabled':''} ${dis?'':`data-page="${p}"`}>${label||p}</button>`;
  let nums = '';
  const wnd = [];
  for (let p=1;p<=pages;p++){ if (p===1||p===pages||Math.abs(p-state.page)<=1) wnd.push(p); }
  let prev = 0;
  for (const p of wnd){ if (p - prev > 1) nums += `<span class="p-ell">…</span>`; nums += btn(p, null, p===state.page, false); prev = p; }
  return `
    <div class="pager" data-od-id="queue-pager">
      <span class="p-info">${total ? `${start+1}–${start+shown}` : '0'} of ${total} accounts · page ${state.page}/${pages}</span>
      <div class="p-btns">
        ${btn(state.page-1, '‹ Prev', false, state.page<=1)}
        ${nums}
        ${btn(state.page+1, 'Next ›', false, state.page>=pages)}
      </div>
    </div>`;
}
function queueRow(a){
  const decided = state.decisions[a.id];
  const rowCls = rowClassFor(a);
  let statusWhy = whyLine(a.why);
  let badge = tierBadge(a.tier);
  if (decided === 'approved'){ badge = `<span class="badge ok">${svg('checkc')}Approved · sending</span>`; }
  if (decided === 'rejected'){ badge = `<span class="badge ghost">${svg('xc')}Rejected</span>`; }
  return `
    <div class="q-row ${rowCls}" data-open="${a.id}" data-od-id="queue-row-${a.id}" tabindex="0" role="button">
      <div class="acct">
        <div class="co">${a.co}</div>

    </div>`;
}

/* ---------- Synthesis helpers — build dossier / draft / escalation for ANY
   account, using rich DETAIL/ESCALATIONS data where it exists and deriving
   sensible values from the account fields where it doesn't. ---------- */
function honorificName(contact){ const p = contact.split(' '); return p.length>1 ? `${p[0]} ${p[p.length-1]}` : contact; }
function dossierFor(a){
  const d = DETAIL[a.id] && DETAIL[a.id].dossier;
  if (d) return d;
  const scoreMap = { high:'81 / 100', med:'63 / 100', low:'44 / 100' };
  return {
    company:a.co, segment: a.segment ? `${a.segment}${a.hub?' · '+a.hub:''}` : '—',
    vessel:a.vessel, imo:a.imo||'—', flag:'Vietnam', relationship:a.relationship||'—',
    triggerText:a.trigger,
    confidence: a.tier===3 ? 'hi' : 'mid',
    confidenceLabel: a.tier===3 ? 'High · based on the buyer\'s own reply' : 'Moderate · inferred from CRM / class records',
    verifiable: a.tier===3 ? 'Verifiable — grounded in the buyer\'s message' : 'Partly verifiable — service interval is illustrative; confirm against class records',
    icp:a.icp, icpScore: scoreMap[a.icp]||'—',
    cleanApprovals: /1 of 2/.test(a.why)?1:0, needed:2,
  };
}
function draftFor(a){
  if (state.draftText[a.id] != null) return state.draftText[a.id];
  if (DETAIL[a.id] && DETAIL[a.id].draft) return DETAIL[a.id].draft;
  const topic = a.trigger.replace(/ —.*$/,'').replace(/ flagged.*$/,'').toLowerCase();
  return `Hi ${honorificName(a.contact)}, a quick heads-up from Erria: it looks like ${a.vessel}'s ${topic} may be approaching its next window. If it would help, we can hold a slot at our Vung Tau station and share a few dates — no obligation, just flagging it for your planning.`;
}
function hardRuleFor(a){
  if (DETAIL[a.id] && DETAIL[a.id].hardRule) return DETAIL[a.id].hardRule;
  if (/[Cc]ompliance-deadline/.test(a.why)) return { label:'Compliance-deadline content', body:'This message is tied to a class/compliance deadline, so it is hard-capped at Tier 2 regardless of account tenure — a human must sign off before send.' };
  return null;
}

/* ---------- Escalation section (used inside Account Detail) ---------- */
function escFor(a){
  const e = ESCALATIONS[a.id]; if (e) return e;
  const reason = a.reason || 'Pricing question';
  const who = honorificName(a.contact);
  const MAP = {
    'Pricing question':      { kick:'Hard trigger · pricing',      detail:'The buyer asked for a concrete price. The agent cannot quote — pricing must come from a human with commercial authority.', reply:`Thanks — could you share indicative pricing for the work at Vung Tau? I need a ballpark for budgeting before I commit to a date.`, next:`Send an indicative quote and confirm two available service dates this month; note final pricing depends on on-site inspection.` },
    'Negative sentiment':    { kick:'Hard trigger · sentiment',    detail:'The reply reads as negative. The agent must not respond autonomously on a strained thread.', reply:`Honestly, the last engagement didn't go smoothly and I'm hesitant to schedule anything new right now.`, next:`Acknowledge the concern directly, skip a new sales pitch, and offer a short call to reset the relationship.` },
    'Relationship conflict': { kick:'Hard trigger · relationship', detail:'The buyer asked to involve their account executive. Routing to a human for relationship handling.', reply:`Can you loop in our account executive before we take this further?`, next:`Coordinate with the named AE, confirm ownership, and hold automated outreach until aligned.` },
    'Disputed service report':{ kick:'Hard trigger · dispute',     detail:'The buyer disputed a prior service report. A human must review the record before replying.', reply:`Your last service report doesn't match what we saw onboard — can someone review it?`, next:`Pull the service record, verify the finding with the Vung Tau station, and reply with a correction or evidence.` },
  };
  const m = MAP[reason] || MAP['Pricing question'];
  return {
    reason: a.why || `${reason} — human required`, reasonKick: m.kick, detail: m.detail,
    meta: [`Escalated ${a.time}`, 'From Tier 2 draft', 'Response SLA: not set — pending policy decision'],
    thread: [
      { who:'Erria Agent', role:'agent', when:'Earlier · approved by M. Tran', body:`Hi ${who}, checking in on ${a.vessel}'s upcoming service window — happy to help schedule at our Vung Tau station.` },
      { who:a.contact, role:'buyer', when:'Today', body:m.reply },
      { who:'System', role:'system', when:'Today', body:`Escalated automatically — ${reason.toLowerCase()} detected. Agent send disabled for this thread until a human responds.` },
    ],
    nextStep: m.next,
  };
}
function escalationSection(a){
  const e = escFor(a);
  const nextVal = state.nextText[a.id] ?? e.nextStep;

  // Repeat-escalation link — human-set, never auto-detected. Links this escalation
  // to a PRIOR resolution record for the same account (shown in Resolution & outcome).
  const priors = RESOLUTIONS[a.id] || [];
  const linkIdx = state.escLink[a.id];
  let repeat = '';
  if (linkIdx != null && priors[linkIdx]){
    const r = priors[linkIdx];
    repeat = `
      <div class="repeat-banner" data-od-id="repeat-banner">
        ${svg('link')}
        <div class="rb-main">
          <div class="rb-kick">Repeat escalation</div>
          <div class="rb-text">Related to a prior resolution — <b>${r.followUpAt.split(',')[0]}</b> · ${r.action}. Handle as a continuation, not a first-time case.</div>
        </div>
        <button class="btn sm" onclick="unlinkEscalation('${a.id}')" data-od-id="btn-unlink">Unlink</button>
      </div>`;
  } else if (priors.length){
    const pend = state.escLinkPending[a.id];
    const hasPend = pend != null && priors[pend];
    repeat = `
      <div class="repeat-link" data-od-id="repeat-link">
        <div class="rl-top">${svg('link')}<span class="rl-title">Is this a repeat of a past issue?</span></div>
        <p class="rl-sub">This account has ${priors.length} resolved case${priors.length>1?'s':''} on record. If this escalation continues one of them, link it so it's handled as a continuation — not a first-time case.</p>
        <div class="rl-row">
          <select onchange="previewLink('${a.id}', this.value)" data-od-id="repeat-link-select" aria-label="Link to a prior resolution">
            <option value="">Link to a prior resolution…</option>
            ${priors.map((r,i)=>`<option value="${i}" ${pend==i?'selected':''}>${r.followUpAt.split(',')[0]} · ${r.action}</option>`).join('')}
          </select>
          ${hasPend ? `<button class="btn primary sm" onclick="commitLink('${a.id}')" data-od-id="repeat-link-commit">${svg('link')} Link it</button>` : ''}
        </div>
        ${hasPend ? `<div class="rl-preview" data-od-id="repeat-link-preview">${svg('info')}<span><b>You'll see:</b> a “Repeat escalation” banner here, cross-referenced with the linked resolution record (${priors[pend].followUpAt.split(',')[0]} · ${priors[pend].action}).</span></div>` : ''}
      </div>`;
  }

  const banner = `
    <div class="esc-banner" data-od-id="escalation-banner">
      <div class="eb-icon">${svg('escalation')}</div>
      <div>
        <div class="eb-kick">${e.reasonKick}</div>
        <div class="eb-reason">${e.reason}</div>
        <div class="eb-detail">${e.detail}</div>
      </div>
      <div class="eb-meta">${e.meta.map(m => `<div>${m}</div>`).join('')}</div>
    </div>`;

  const nextBody = state.editingNext
    ? `<textarea class="ns-edit" id="nsEdit" data-od-id="next-step-editor">${nextVal}</textarea>
       <div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary sm" onclick="saveNext()">${svg('check')} Save</button><button class="btn sm" onclick="cancelNext()">Cancel</button></div>`
    : `<div class="ns-body">${nextVal}</div>`;

  const nextStep = `
    <div class="next-step" data-od-id="next-step">
      <div class="ns-head">${svg('spark')}<span class="ns-title">Recommended next step</span><span class="ns-tag badge ghost">Agent-suggested · human-editable</span></div>
      ${nextBody}
      <div class="ns-actions">
        <button class="btn" onclick="toggleNext()" data-od-id="btn-edit-next">${svg('pencil')} Edit recommendation</button>
        <span class="no-send">${svg('lock')} Agent send is disabled for this thread — only you can act</span>
      </div>
    </div>`;

  const resolved = state.escResolved[a.id];
  const actionBar = resolved
    ? `<div class="esc-actionbar done" data-od-id="escalation-actions"><div class="ea-done">${svg('checkc')} Resolved by you — logged below in Resolution & outcome</div><button class="btn sm" onclick="reopenEsc('${a.id}')">Reopen</button></div>`
    : `<div class="esc-actionbar" data-od-id="escalation-actions">
        <div class="ea-lead">${svg('user')} Your move — the human decides what happens next</div>
        <button class="btn" onclick="markResolved('${a.id}')" data-od-id="btn-mark-resolved">${svg('check')} Mark resolved</button>
        <button class="btn primary" onclick="sendReply('${a.id}')" data-od-id="btn-send-reply">${svg('send')} Compose &amp; send reply</button>
      </div>`;

  const thread = `
    <div class="section-head" style="margin-top:20px"><h2>Conversation history</h2><span class="hint">Full thread</span></div>
    <div class="thread" data-od-id="escalation-thread">${e.thread.map(m => escMsg(m)).join('')}</div>`;

  return repeat + banner + nextStep + actionBar + thread;
}

/* ---------- shared timeline renderer + per-account synthesis ---------- */
function timelineHTML(items){
  return `<div class="audit-card" data-od-id="audit-timeline"><div class="timeline">
    ${items.map(it => `
      <div class="tl-item ${it.kind}">
        <div class="tl-when">${it.when}</div>
        <div class="tl-title"><span class="tt">${it.title}</span>${it.manual?`<span class="tl-manual" data-od-id="manual-tag">${svg('user')} Manual</span>`:''}${tierBadge(it.badge)}</div>
        <div class="tl-reason">${it.reason}</div>
      </div>`).join('')}
  </div></div>`;
}
/* full per-account history = human manual overrides (newest first) + automatic entries */
function fullHistory(a){ return [ ...(state.manualHistory[a.id]||[]), ...auditFor(a) ]; }
function auditFor(a){
  if (AUDIT[a.id]) return AUDIT[a.id];
  const created = { kind:'create', when:'On import', title:'Account created', badge: a.tier===1?1:2, reason:'Imported from the Mermaid Maritime Vietnam prospect list; starting tier set by new-account policy.' };
  const now = a.tier===1
    ? { kind:'promote', when:a.time, title:'Running autonomously (Tier 1)', badge:1, reason:a.why }
    : a.tier===3
      ? { kind:'escalate', when:a.time, title:'Escalated to Tier 3', badge:'esc', reason:a.why }
      : { kind:'current', when:a.time, title:'Draft awaiting approval', badge:2, reason:a.why };
  return [created, now];
}

/* ---------- Resolution & Outcome (closed escalations for this account) ---------- */
function resolutionsFor(a){ return [ ...(state.liveResolutions[a.id]||[]), ...(RESOLUTIONS[a.id]||[]) ]; }
function resolutionSection(a){
  const recs = resolutionsFor(a);
  if (!recs.length){
    return `<div class="res-empty" data-od-id="resolution-empty">${svg('info')} No closed escalations yet for this account. When an escalation here is resolved, its action, follow-up, outcome, and time-to-resolution are logged here.</div>`;
  }
  return recs.map(r => `
    <div class="res-row" data-od-id="resolution-row">
      <div><div class="rk">Human action</div><div class="rv">${r.action}<span class="rt">by ${r.by}</span></div></div>
      <div><div class="rk">Follow-up sent</div><div class="rv mut">${r.followUp}<span class="rt">${r.followUpAt}</span></div></div>
      <div><div class="rk">Outcome</div><div class="rv">${outcomeBadge(r.outcome)}</div></div>
      <div><div class="rk">Time to resolve</div><div class="rv mut">${r.ttr}</div></div>
    </div>`).join('');
}

/* ---------- NEW Screen: Account Detail (the full story of one account) ---------- */
function renderDetail(){
  const a = acct(state.detailId);
  if (!a) return `<div class="empty">${svg('building')}<div><b>No account selected</b></div><button class="btn primary" onclick="setView('queue')">${svg('queue')} Go to queue</button></div>`;
  const outreachTitle = a.tier===3 ? 'Active escalation' : a.tier===1 ? 'Latest activity' : 'Draft awaiting approval';
  const outreachIcon  = a.tier===3 ? 'escalation' : 'review';
  const backLabel = { queue:'queue', review:'review worklist', escalation:'escalations', audit:'audit trail' }[state.detailFrom] || 'queue';

  const tab = state.detailTab || 'work';
  const resCount = resolutionsFor(a).length;
  const pending  = a.tier===2 && !state.decisions[a.id];
  const escOpen  = a.tier===3 && !state.escResolved[a.id];
  const needsDot = pending || escOpen;
  const workLabel = a.tier===3 ? 'Escalation' : a.tier===1 ? 'Activity' : 'Draft review';
  const workIcon  = a.tier===3 ? 'escalation' : a.tier===1 ? 'robot' : 'review';

  const tabbar = `
    <div class="detail-tabs" data-od-id="detail-tabs">
      <button class="detail-tab ${tab==='info'?'active':''}" data-detail-tab="info" data-od-id="tab-info">${svg('building')} Account info</button>
      <button class="detail-tab ${tab==='work'?'active':''}" data-detail-tab="work" data-od-id="tab-work">${svg(workIcon)} ${workLabel} ${needsDot?`<span class="tdot ${escOpen?'red':''}"></span>`:''}</button>
      <button class="detail-tab ${tab==='history'?'active':''}" data-detail-tab="history" data-od-id="tab-history">${svg('audit')} Tier history</button>

    </div>`;

  let panel;
  if (tab === 'info'){
    panel = `
      <div class="detail-panel info-wrap" data-od-id="detail-info">
        ${renderDossier(a)}
      </div>`;
  } else if (tab === 'history'){
    panel = `
      <div class="detail-panel" data-od-id="detail-history">
        <p class="divider-note" style="margin-top:0">Every tier is earned or justified — this log shows why <b>${a.co}</b> sits where it does, and what would move it. <b>Manual</b>-tagged entries are human overrides; the rest are system-driven.</p>
        ${timelineHTML(fullHistory(a))}
      </div>`;
  } else if (tab === 'resolution'){
    panel = `
      <div class="detail-panel" data-od-id="detail-resolution">
        <p class="divider-note" style="margin-top:0">One record per closed escalation — the human action, the follow-up sent, its outcome, and time-to-resolution. Closing an active escalation logs a record here.</p>
        ${resolutionSection(a)}
      </div>`;
  } else {
    // working tab — full-width reading column; account info is one click away on its own tab
    panel = `
      <div class="detail-panel detail-narrow" data-od-id="detail-work">
        <div class="detail-section" data-od-id="detail-outreach">
          <div class="sh">${svg(outreachIcon)}<span class="st">${outreachTitle}</span><button class="btn sm sh-right" data-detail-tab="info" data-od-id="jump-info">${svg('building')} Account info</button></div>
          ${outreachSection(a)}
        </div>
      </div>`;
  }

  return `
    <div class="detail-top" data-od-id="detail-top">
      <button class="back-btn" onclick="setView('${state.detailFrom}')" data-od-id="detail-back">${svg('arrow')} Back to ${backLabel}</button>
      <div class="detail-hd">
        <h1>${a.co}</h1>
        <div class="sub">${svg('ship')} ${a.vessel} <span>·</span> ${svg('user')} ${a.contact}, ${a.role} <span>·</span> ${a.imo || (DETAIL[a.id]&&DETAIL[a.id].dossier.imo) || ''}</div>
      </div>
      <div class="detail-tier" data-od-id="detail-tier">
        ${tierBadge(a.tier)}
        <button class="tier-change-link" onclick="openTierPanel()" data-od-id="change-tier-link">${svg('pencil')} Change tier</button>
      </div>
    </div>
    ${state.tierPanelOpen ? tierPanel(a) : ''}

function tierPanel(a){

function escMsg(m){
  const cls = m.role === 'buyer' ? 'inbound' : (m.role === 'system' ? '' : 'draft');

  const style = m.role === 'system' ? 'style="background:var(--surface);border-style:dashed"' : '';
  return `<div class="msg ${cls}" ${style}><div class="m-head"><span class="m-who">${label}</span><span class="m-when">${m.when}</span></div><div class="m-body">${m.body}</div></div>`;
}
