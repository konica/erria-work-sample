   Note: no change log — deferred together with access control. Logging
   changes without a notion of WHO can change them (a two-person team
   shares one login) would imply accountability the system can't back up.
   ============================================================ */
const HARD_RULES = [
  { name:'Pricing question', desc:'Any request for a concrete price or quote — pricing needs a human with commercial authority.' },
  { name:'Technical / compliance question', desc:'Substantive technical or regulatory questions the agent must not answer autonomously.' },
  { name:'Negative sentiment / complaint / opt-out', desc:'Any complaint, strained reply, or request to stop contact.' },
  { name:'Existing-relationship signal', desc:'Signs of an active relationship the agent isn\'t aware of (e.g. "talk to our AE").' },
  { name:'Compliance-deadline content', desc:'Messages tied to a specific vessel\'s class/compliance deadline — capped at Tier 2.' },
];

function advChangeList(){
  const s = state.work, sv = state.saved, out = [];
  if (s.maxFollowups!==sv.maxFollowups) out.push(`Max follow-ups per account: ${sv.maxFollowups} → ${s.maxFollowups}`);
  if (s.minDays!==sv.minDays) out.push(`Minimum days between follow-ups: ${sv.minDays} → ${s.minDays}`);
  if (s.sentimentFloor!==sv.sentimentFloor) out.push(`Escalation sensitivity: ${sv.sentimentFloor} → ${s.sentimentFloor}`);
  return out;
}

function renderSettings(){
  const s = state.work, sv = state.saved;
  const advChanges = advChangeList();

  const basic = `
    <section class="set-sec" data-od-id="settings-basic">
      <div class="set-head"><span class="set-badge">${svg('gear')} Basic</span><span class="set-sub">Low-risk — saves immediately, no confirmation</span></div>
      <div class="set-grid">
        <label class="field">
          <span class="fl">Clean approvals required before Tier 1</span>
          <span class="fh">How many clean approvals an account earns before it becomes autonomous.</span>
          <input type="number" min="1" max="4" value="${s.threshold}" oninput="settingInput('threshold', this.value)" data-od-id="set-threshold" />
        </label>
        <label class="field">
          <span class="fl">Tier 1 audit-sample rate</span>
          <span class="fh">Share of autonomous sends pulled into the Send Audit queue.</span>
          <span class="input-suffix"><input type="number" min="1" max="100" value="${s.sampleRate}" oninput="settingInput('sampleRate', this.value)" data-od-id="set-samplerate" /><i>%</i></span>
        </label>
      </div>
      <div class="set-save">
        <button class="btn primary sm" onclick="saveBasic()" data-od-id="save-basic">${svg('check')} Save</button>
        <span class="set-hint ok">${svg('checkc')} Saves immediately — no confirmation</span>
      </div>
    </section>`;

  const advBody = `
      <div class="set-grid">
        <label class="field">
          <span class="fl">Max follow-ups per account</span>
          <span class="fh">Cap on automated follow-ups before the agent stops.</span>
          <input type="number" min="1" max="5" value="${s.maxFollowups}" oninput="settingInput('maxFollowups', this.value)" data-od-id="set-maxfollowups" />
        </label>
        <label class="field">
          <span class="fl">Minimum days between follow-ups</span>
          <span class="fh">Quiet period enforced between messages to one account.</span>
          <input type="number" min="3" max="14" value="${s.minDays}" oninput="settingInput('minDays', this.value)" data-od-id="set-mindays" />
        </label>
        <label class="field">
          <span class="fl">Escalation sensitivity</span>
          <span class="fh">Negative-sentiment confidence floor for auto-escalation. Higher = fewer, more certain escalations.</span>
          <div class="seg" data-od-id="set-sentiment">
            ${['Low','Medium','High'].map(v=>`<button class="${s.sentimentFloor===v?'on':''}" onclick="settingInput('sentimentFloor','${v}')">${v}</button>`).join('')}
          </div>
        </label>
      </div>
      <div class="set-save set-save-col">
        ${state.confirmB
          ? `<div class="confirm-inline" data-od-id="confirm-advanced">
               <div class="ci-head">${svg('info')} Confirm ${advChanges.length>1?'these changes':'this change'} before it takes effect</div>
               <ul class="ci-list">${advChanges.map(c=>`<li>${c}</li>`).join('')}</ul>
               <div class="ci-note">Applies to new triggers and sends going forward — not retroactively.</div>
               <div class="ci-actions">
                 <button class="btn primary sm" onclick="confirmAdvanced()" data-od-id="confirm-advanced-yes">${svg('check')} Confirm &amp; apply</button>
                 <button class="btn sm" onclick="cancelAdvanced()" data-od-id="confirm-advanced-cancel">Cancel — nothing saved</button>
               </div>
             </div>`
          : `<div class="set-save"><button class="btn primary sm" onclick="saveAdvanced()" data-od-id="save-advanced">${svg('lock')} Save (requires confirm)</button>
             <span class="set-hint">One step heavier — clicking opens a confirm step; nothing saves until you confirm</span></div>`}
      </div>`;

  const advanced = `
    <section class="set-sec" data-od-id="settings-advanced">
      <button class="set-expander ${state.advancedOpen?'open':''}" onclick="toggleAdvanced()" data-od-id="toggle-advanced">
        ${svg('chevron')} <span class="set-badge alt">Advanced</span>
        <span class="set-sub">Higher-risk — each save needs an explicit confirm step</span>
      </button>
      ${state.advancedOpen ? `<div class="set-adv-body">${advBody}</div>` : ''}
    </section>`;

  const locked = `
    <section class="set-sec locked" data-od-id="settings-locked">
      <div class="set-head"><span class="set-badge lock">${svg('lock')} Locked</span><span class="set-sub">Visible for reference — policy decisions, not admin-configurable</span></div>
      <div class="lock-list">
        ${HARD_RULES.map(r=>`
          <div class="lock-row" data-od-id="lock-rule">
            <div class="lr-main"><div class="lr-name">${r.name}</div><div class="lr-desc">${r.desc}</div></div>
            <div class="lr-note">${svg('lock')} Locked — policy decision</div>
          </div>`).join('')}
        <div class="lock-row" data-od-id="lock-overlay">
          <div class="lr-main"><div class="lr-name">New-account Tier 2 rollout overlay</div><div class="lr-desc">Whether new accounts start capped at Tier 2 until they earn clean approvals.</div></div>
          <div class="lr-note">${svg('lock')} Locked — policy decision</div>
        </div>
      </div>
    </section>`;

  return `<div class="settings-wrap">${basic}${advanced}${locked}</div>`;
}

/* ============================================================
   INTERACTIONS
   ============================================================ */
function openAccount(id){
  const a = acct(id); if (!a) return;
  state.detailId = id; state.reviewId = id; state.escId = id;
  state.detailTab = 'work';
  state.editing = false; state.editingNext = false;
  if (state.view !== 'detail') state.detailFrom = state.view;
  setView('detail');
}
function decide(id, verdict){
  state.decisions[id] = verdict;
  state.editing = false;
  render();
  if (verdict === 'approved') toast('ok','check','Approved — message sent to '+acct(id).contact.split(' ').slice(-1)[0]);
  else toast('warn','x','Draft rejected — returned to the agent');
}
function undoDecision(id){ delete state.decisions[id]; render(); }
function toggleEdit(){ state.editing = !state.editing; render(); if (state.editing){ const el = document.getElementById('draftEdit'); if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } } }
function saveEdit(){ const el = document.getElementById('draftEdit'); if (el) state.draftText[state.reviewId] = el.value; state.editing = false; render(); toast('ok','check','Draft updated'); }
function cancelEdit(){ state.editing = false; render(); }
function toggleNext(){ state.editingNext = !state.editingNext; render(); if (state.editingNext){ const el = document.getElementById('nsEdit'); if (el) el.focus(); } }
function saveNext(){ const el = document.getElementById('nsEdit'); if (el) state.nextText[state.detailId] = el.value; state.editingNext = false; render(); toast('ok','check','Recommendation updated'); }
function cancelNext(){ state.editingNext = false; render(); }
function logResolution(id, rec){ (state.liveResolutions[id] = state.liveResolutions[id] || []).unshift(rec); }
function sendReply(id){
  const a = acct(id);
  const followUp = state.nextText[id] ?? escFor(a).nextStep;
  state.escResolved[id] = true;
  logResolution(id, { action:'Sent reply to buyer', by:'You', followUp, followUpAt:'Today · just now', outcome:'reeng', ttr:'just now · no SLA set' });
  render(); toast('ok','send','Reply sent as a human — logged in Resolution & outcome');
}
function markResolved(id){
  state.escResolved[id] = true;
  logResolution(id, { action:'Marked resolved — no action needed', by:'You', followUp:'—', followUpAt:'Today · just now', outcome:'closed', ttr:'just now · no SLA set' });
  render(); toast('ok','check','Escalation marked resolved — logged in Resolution & outcome');
}
function reopenEsc(id){ delete state.escResolved[id]; if (state.liveResolutions[id]) state.liveResolutions[id] = []; render(); }

/* repeat-escalation linking (human-set, never auto-detected; select previews, then commit) */
function previewLink(id, idx){ if (idx===''){ delete state.escLinkPending[id]; } else { state.escLinkPending[id] = +idx; } render(); }
function commitLink(id){ const p = state.escLinkPending[id]; if (p==null) return; state.escLink[id] = p; delete state.escLinkPending[id]; render(); toast('ok','link','Linked to a prior resolution — now flagged as a repeat escalation'); }
function unlinkEscalation(id){ delete state.escLink[id]; delete state.escLinkPending[id]; render(); }

/* manual tier override — general-purpose, human-driven, no access control (same as Settings) */
function openTierPanel(){ const a=acct(state.detailId); state.tierPanelOpen=true; state.tierSel=a.tier; state.tierReason=''; state.tierErr=false; render(); }
function cancelTier(){ state.tierPanelOpen=false; state.tierErr=false; render(); }
function setTierSel(n){ state.tierSel=n; render(); }
function tierReasonInput(v){
  state.tierReason=v;
  if (state.tierErr && v.trim()){ state.tierErr=false; const e=document.querySelector('.tp-err'); if(e) e.remove(); const i=document.querySelector('.tp-reason'); if(i) i.classList.remove('err'); }
}
function confirmTier(){
  const a=acct(state.detailId); const from=a.tier; const to=state.tierSel||a.tier;
  const reason=(state.tierReason||'').trim();
  if (!reason){ state.tierErr=true; render(); return; }
  if (to===from){ toast('warn','info',`Already Tier ${from} — pick a different tier to change it`); return; }
  (state.manualHistory[a.id] = state.manualHistory[a.id] || []).unshift({
    kind:'manual', manual:true, when:'Today · just now',
    title:`Manually changed to Tier ${to}`, badge:to, from, to, by:'You',
    reason:`Tier ${from} → Tier ${to}. “${reason}” — by You (manual override).`
  });
  a.tier = to;
  state.tierPanelOpen=false; state.tierErr=false;
  render();
  toast('ok','check',`Tier changed to Tier ${to} — recorded in Tier History`);
}

/* Send Audit */
function markSend(id, verdict){
  state.auditMarks[id] = state.auditMarks[id]===verdict ? undefined : verdict;
  if (!state.auditMarks[id]) delete state.auditMarks[id];
  render();
  if (state.auditMarks[id]==='concerning') toast('warn','flag','Flagged as concerning — stays in the list for pattern-spotting');
  else if (state.auditMarks[id]==='fine') toast('ok','check','Marked fine');
}
function toggleSend(id){ state.auditOpen[id] = !state.auditOpen[id]; render(); }

/* Settings */
function settingInput(field, val){
  const numeric = ['threshold','sampleRate','maxFollowups','minDays'];
  state.work[field] = numeric.includes(field) ? (val===''?'':+val) : val;
  if (field==='sentimentFloor') render(); // segmented control needs a repaint
}
function saveBasic(){
  const s=state.work, sv=state.saved;
  const changed = s.threshold!==sv.threshold || s.sampleRate!==sv.sampleRate;
  state.saved.threshold=s.threshold; state.saved.sampleRate=s.sampleRate;
  render(); toast(changed?'ok':'warn','check', changed ? 'Saved' : 'No changes to save');
}
function toggleAdvanced(){ state.advancedOpen = !state.advancedOpen; state.confirmB=false; render(); }
function saveAdvanced(){
  if (!advChangeList().length){ toast('warn','info','No changes to apply'); return; }
  state.confirmB = true; render();
}
function cancelAdvanced(){ state.confirmB = false; render(); }
function confirmAdvanced(){
  const s=state.work, sv=state.saved;
  state.saved.maxFollowups=s.maxFollowups; state.saved.minDays=s.minDays; state.saved.sentimentFloor=s.sentimentFloor;
  state.confirmB=false; render(); toast('ok','check','Applied — takes effect for new triggers going forward');
}

function toast(kind, icon, msg){
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `${svg(icon==='check'?'checkc':icon==='x'?'xc':icon)} ${msg}`;
  wrap.appendChild(el);
  setTimeout(() => { el.style.transition='opacity .3s, transform .3s'; el.style.opacity='0'; el.style.transform='translateY(8px)'; setTimeout(()=>el.remove(),300); }, 2600);
}

/* theme */
function toggleTheme(){
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  try { localStorage.setItem('erria-theme', next); } catch(e){}
  paintThemeBtn();
}
function paintThemeBtn(){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.getElementById('themeToggle').innerHTML = `${svg(dark?'sun':'moon')} ${dark ? 'Light' : 'Dark'}`;
}

/* ============================================================
   EVENT WIRING
   ============================================================ */
document.addEventListener('click', (e) => {
  const nav = e.target.closest('.nav-item'); if (nav){ setView(nav.dataset.nav); return; }
  const pg = e.target.closest('[data-page]'); if (pg){ state.page = +pg.dataset.page; render(); return; }
  const dt = e.target.closest('[data-detail-tab]'); if (dt){ state.detailTab = dt.dataset.detailTab; state.editing = false; state.editingNext = false; render(); return; }
  const row = e.target.closest('[data-open]'); if (row){ openAccount(row.dataset.open); return; }
  const sa = e.target.closest('[data-sa-toggle]'); if (sa){ toggleSend(sa.dataset.saToggle); return; }
  const chip = e.target.closest('[data-filter]'); if (chip){ state.filter = chip.dataset.filter; state.page = 1; render(); return; }
  if (e.target.closest('#themeToggle')){ toggleTheme(); return; }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'auditSelect'){ state.auditId = e.target.value; render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { if (state.editing) saveEdit(); else if (state.editingNext) saveNext(); }
    return;
  }
  // row open via Enter
  const row = e.target.closest && e.target.closest('[data-open]');
  if (row && e.key === 'Enter'){ openAccount(row.dataset.open); return; }
  // review shortcuts — active on the Account Detail working tab for a pending Tier 2 draft
  if (state.view === 'detail' && state.detailTab === 'work'){
    const a = acct(state.detailId);
    if (a && a.tier === 2 && !state.decisions[a.id] && !state.editing){
      if (e.key === 'a' || e.key === 'A'){ decide(a.id,'approved'); }
      else if (e.key === 'r' || e.key === 'R'){ decide(a.id,'rejected'); }
      else if (e.key === 'e' || e.key === 'E'){ toggleEdit(); }
    }
  }
});

/* boot */
(function(){
  try { const saved = localStorage.getItem('erria-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); } catch(e){}
  paintThemeBtn();
  render();
})();
</script>
</body>
</html>
