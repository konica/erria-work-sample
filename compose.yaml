# Local runtime dependencies for development. Not a deployment artifact — the apps
# themselves run on the host via `pnpm --filter <app> dev`, and CI uses Testcontainers
# rather than this file.
#
# Bring the stack up with `pnpm compose:up` (which also applies migrations).
#
# An explicit project name keeps the stack identity stable no matter which checkout
# or worktree it is started from, so `compose:down` always finds what `compose:up`
# started instead of leaving one orphaned stack per directory.
name: erria

services:
  postgres:
    image: postgres:17 # keep in sync with packages/db/src/test-utils/testcontainers-postgres.ts
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erria}
      POSTGRES_DB: ${POSTGRES_DB:-erria_dev}
    ports:
      # Overridable for anyone already running Postgres on 5432. Compose reads the
      # workspace-root .env automatically, so POSTGRES_PORT can be set there.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - erria-pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 is deliberate: during initdb the entrypoint runs a temporary
      # server reachable over the unix socket, so a socket-based pg_isready reports
      # ready before the real server accepts TCP connections. Checking TCP is both
      # stricter and what the apps actually do. This is what makes `up --wait`
      # meaningful — without a healthcheck it returns as soon as the container runs.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-erria} -d ${POSTGRES_DB:-erria_dev}']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    # start-dev, not start: no HTTPS/hostname config needed for a box only ever reached at
    # localhost. dev-entrypoint.sh runs start-dev --import-realm (loading realm-export.json,
    # #75) and then sets the seeded users' passwords from KEYCLOAK_SEED_PASSWORD via kcadm —
    # realm-export.json itself carries no credential, only role/client/user *definitions*.
    entrypoint: ['bash', '/opt/keycloak/dev-entrypoint.sh']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_SEED_PASSWORD: ${KEYCLOAK_SEED_PASSWORD:-erria-dev}
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '${KEYCLOAK_PORT:-8080}:8080'
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./keycloak/dev-entrypoint.sh:/opt/keycloak/dev-entrypoint.sh:ro
    healthcheck:
      # The Keycloak image ships bash but no curl/wget, so the health check speaks HTTP over
      # bash's /dev/tcp against the management port (9000, separate from the app port since
      # Keycloak 26) rather than shelling out to a tool that isn't there.
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/9000
          printf 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  erria-pgdata:
