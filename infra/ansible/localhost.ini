# Inventory for setting up the machine you are sitting at.
#
#   ansible-playbook -i infra/ansible/localhost.ini \
#     infra/ansible/install-provisioning-tools.yml --ask-become-pass
#
# This exists rather than the shorter `-i localhost, -c local` because that ad-hoc form drops the
# host into `ungrouped`, where the playbook's `hosts: provisioning_workstations` never matches it
# — the run reports "skipping: no hosts matched" and silently installs nothing. Naming the group
# here keeps that safety (no `hosts: all`) while making the local case a one-liner.

[provisioning_workstations]
localhost ansible_connection=local
