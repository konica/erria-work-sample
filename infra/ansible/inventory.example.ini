# Copy to inventory.ini and edit. Only needed for the remote case — to set up the machine you are
# sitting at, use the committed localhost.ini instead:
#
#   ansible-playbook -i infra/ansible/localhost.ini \
#     infra/ansible/install-provisioning-tools.yml --ask-become-pass
#
# The group name must stay `provisioning_workstations` — that is what the playbook's `hosts:`
# line matches.
#
# These are engineers' workstations, not the review VM. The review VM installs its own software
# from infra/terraform/cloud-init.yaml.tftpl and must not be listed here.

[provisioning_workstations]
# devbox   ansible_host=10.0.0.12  ansible_user=youruser
# yourname-laptop.local

[provisioning_workstations:vars]
# Uncomment to pin a Terraform other than the playbook default (which tracks
# .github/workflows/terraform-plan.yml):
# terraform_version=1.9.8
#
# Only consulted when packages.microsoft.com has no build for the host's own release:
# azure_cli_fallback_suite=noble
