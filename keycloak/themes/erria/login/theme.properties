# Custom login theme for the erria realm (#99). Extends keycloak.v2 (the shipped default as of
# Keycloak 26) rather than the legacy `base`/`keycloak` themes, so we inherit its Patternfly v5
# markup/CSS-hook classes (kcButtonClass, kcFormClass, etc.) and only override what #99 actually
# asks for: colors/spacing/radius from design-system/tokens.css, and the header logo.
parent=keycloak.v2

# Restates keycloak.v2's own `styles` value (verified against its theme.properties — Keycloak has
# no documented/verified `${parent.styles}` inheritance syntax for this key) and appends login.css,
# which is the only new stylesheet this theme adds.
styles=css/styles.css css/login.css

# keycloak.v2 auto-switches to a dark palette from `prefers-color-scheme` (template.ftl's inline
# script). The login page has no app-level theme state to key off (design-system/DESIGN.md's
# light/dark rationale doesn't apply pre-auth), so #99 keeps this theme light-only rather than
# half-supporting a dark variant no design token exists for.
darkMode=false
